<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="PlantPay Intelligence Engine: follow one invoice through matching, root cause, risk signals, approval and a tamper-evident audit trail. Synthetic data, LYB Mumbai Hackathon 2026 prototype." />
    <title>PlantPay · Every invoice has a story</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2305070d'/%3E%3Crect x='9' y='7' width='14' height='18' rx='2' fill='none' stroke='%233d8bff' stroke-width='2'/%3E%3Cpath d='M12 13h8M12 17h5' stroke='%233d8bff' stroke-width='2'/%3E%3C/svg%3E" />
    <script>
      // Theme before first paint (no flash): ?theme=light|dark, else the saved choice, else the system setting.
      (function () {
        var t = new URLSearchParams(location.search).get("theme");
        if (t !== "light" && t !== "dark") { try { t = localStorage.getItem("plantpay-landing-theme"); } catch (e) { t = null; } }
        if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <style>
      /* Critical first paint: shown before any script runs. */
      html, body { margin: 0; background: #05070d; color: #e8edf5; }
      html[data-theme="light"], html[data-theme="light"] body { background: #eef2f8; color: #0d1626; }
      html[data-theme="light"] #boot b { color: #45536a; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; font: 500 15px/1.4 system-ui, "Segoe UI", sans-serif; letter-spacing: 0.02em; }
      #boot b { display: block; font-size: 13px; color: #8d99ab; font-weight: 500; margin-top: 10px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><div>PlantPay<b>Loading</b></div></div>
    <div id="root"></div>
    <noscript><p style="padding:24px">PlantPay's story page needs JavaScript. Open <a href="/login" style="color:#5aa2ff">the live demo</a> directly.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
